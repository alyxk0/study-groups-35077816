server:
  address: 127.0.0.1
  port: ${PORT:16287}
  tomcat:
    threads:
      max: 24
      min-spare: 2
    max-connections: 100
    accept-count: 20
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://pg:5432/studs?currentSchema=s466287}
    username: ${DB_USER:s466287}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 15000
  flyway:
    locations: classpath:db/helios
    default-schema: s466287
    schemas: s466287
    create-schemas: false
    table: sg35077816_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
app:
  persistence:
    mapping-resource: META-INF/orm-helios.xml
