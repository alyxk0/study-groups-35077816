server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/study_groups}
    username: ${DB_USER:study}
    password: ${DB_PASSWORD:study_local}
  jackson:
    deserialization:
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 1800000
  flyway:
    enabled: true
logging:
  level:
    org.eclipse.persistence: WARN
